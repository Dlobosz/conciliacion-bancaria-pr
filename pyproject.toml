# Configuracion del linter. El proyecto no se empaqueta como libreria, asi que
# aqui solo vive la configuracion de herramientas.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "UP", "C4", "RET", "ARG", "PD"]

[tool.ruff.lint.per-file-ignores]
# En los tests, monkeypatch.setattr necesita lambdas que reciben self sin usarlo.
"tests/*" = ["ARG005"]
